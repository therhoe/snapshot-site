<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>snapshot cro</title>

<link rel="icon" href="assets/img/logo.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

  <section class="hero">
    <div>
      <h1 class="logo">
        <img src="assets/img/logo.png" alt="snapshot cro" width="1072" height="128">
      </h1>

      <nav class="buttons">
        <a href="install-snapshot/">install app</a>
        <a href="workshop/">do the workshop</a>
      </nav>
    </div>
  </section>

  <section class="grid-section">
    <div class="container">
      <!-- Cards are rendered from data/items.json by assets/js/grid.js -->
      <div class="grid" id="grid"></div>
    </div>
  </section>

  <div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title" hidden>
    <div class="modal-panel">
      <button class="modal-close" type="button" aria-label="Close">&times;</button>
      <div class="modal-image" hidden></div>
      <h2 class="modal-title" id="modal-title"></h2>
      <p class="modal-subtitle"></p>
      <div class="modal-body"></div>
    </div>
  </div>

  <script src="assets/js/grid.js"></script>
</body>
</html>
